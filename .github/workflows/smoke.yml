name: Deploy Smoke Tests

# Container smoke test for the unattended (cloud-init) install path.
# Runs when the install/deploy assets change on a branch push or PR. The
# upstream release-follow-up job is intentionally omitted in this fork because
# install.sh currently resolves published versions from MHSanaei/3x-ui; running
# it after a fork release would test the upstream repository, not this build.

on:
  push:
    branches:
      - "**"
    paths:
      - "install.sh"
      - "deploy/**"
      - ".github/workflows/smoke.yml"
  pull_request:
    paths:
      - "install.sh"
      - "deploy/**"
      - ".github/workflows/smoke.yml"

permissions:
  contents: read

jobs:
  noninteractive-install:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Non-interactive install smoke test
        run: bash deploy/test/smoke-noninteractive.sh
